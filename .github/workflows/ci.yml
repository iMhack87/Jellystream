name: CI

# Every push and every pull request. The repository is public, so Actions
# minutes are free — there is no reason to be clever about when to run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run it interrupts
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-and-android:
    name: Shared tests + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared tests
        run: ./gradlew :shared:testDebugUnitTest

      - name: Android APK
        run: ./gradlew :androidApp:assembleDebug

      # The report says which test failed; the log only says a task did
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  apple:
    name: iOS + tvOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: XCFramework
        # Xcode never rebuilds this; a stale one means testing old code
        run: ./gradlew :shared:assembleSharedDebugXCFramework

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate project
        # Jellystream.xcodeproj is generated and gitignored
        working-directory: appleApp
        run: xcodegen generate

      - name: Build iOS
        working-directory: appleApp
        run: |
          xcodebuild -project Jellystream.xcodeproj -scheme Jellystream \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO

      - name: Build tvOS
        working-directory: appleApp
        run: |
          xcodebuild -project Jellystream.xcodeproj -scheme JellystreamTV \
            -destination 'generic/platform=tvOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO
